<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — TONE / FORM | Personalized Beauty Profile</title>
  <meta name="description" content="Join TONE / FORM to save your calibrated shade results, customize foundation kits, and receive intelligent shade updates.">
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="stylesheet" href="assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-surface">

  <!-- Main Centered Layout -->
  <main class="min-vh-100 d-flex flex-column align-items-center justify-content-center p-3 p-sm-4 position-relative">
    
    <!-- Top Right Corner Theme Toggle Button Only -->
    <div class="position-absolute top-0 end-0 p-3 p-md-4 z-3">
      <button class="btn-theme-toggle" type="button" aria-label="Toggle theme" title="Toggle light or dark theme">
        <i class="bi bi-moon-stars"></i>
      </button>
    </div>

    <!-- Brand Logo Top Center Above Box -->
    <div class="text-center mb-4">
      <a class="navbar-brand navbar-brand-logo d-inline-flex align-items-center gap-2 text-decoration-none" href="index.html">
        <svg class="brand-logo-icon" width="34" height="34" viewBox="0 0 48 48" fill="none">
          <circle cx="20" cy="24" r="14" stroke="currentColor" stroke-width="2.8" opacity="0.95"/>
          <circle cx="28" cy="24" r="14" stroke="currentColor" stroke-width="2.8" opacity="0.85"/>
          <circle cx="24" cy="24" r="4.5" fill="currentColor"/>
        </svg>
        <span class="fs-4 fw-bold">TONE <span class="divider">/</span> FORM</span>
      </a>
    </div>

    <!-- Centered Signup Box -->
    <div class="card auth-card p-4 p-md-5 border-tf bg-surface rounded-4 shadow-sm w-100" style="max-width: 450px;">
      
      <div class="text-center mb-4">
        <span class="editorial-tag">Registration</span>
        <h2 class="display-font mb-1">Create Your Profile</h2>
        <p class="text-muted-tf small mb-0">Register for smart complexion discovery and kit savings.</p>
      </div>

      <!-- Signup Form (All Inputs in Separate Lines) -->
      <form id="signup-form">
        <!-- Separate Line 1: Full Name -->
        <div class="mb-3">
          <label for="reg-name" class="form-label-tf">Full Name</label>
          <input type="text" class="form-control-tf" id="reg-name" placeholder="First and last name" required>
        </div>

        <!-- Separate Line 2: Email Address -->
        <div class="mb-3">
          <label for="reg-email" class="form-label-tf">Email Address</label>
          <input type="email" class="form-control-tf" id="reg-email" placeholder="name@domain.com" required>
        </div>

        <!-- Separate Line 3: Password with Eye Icon at end of field -->
        <div class="mb-3">
          <label for="reg-pass" class="form-label-tf">Password</label>
          <div class="position-relative">
            <input type="password" class="form-control-tf pe-5" id="reg-pass" placeholder="••••••••" required>
            <button class="btn text-muted-tf position-absolute top-50 end-0 translate-middle-y me-2 p-1 border-0 btn-toggle-password" type="button" data-target-input="reg-pass" aria-label="Toggle password view">
              <i class="bi bi-eye fs-5"></i>
            </button>
          </div>
        </div>

        <!-- Separate Line 4: Confirm Password with Eye Icon at end of field -->
        <div class="mb-3">
          <label for="reg-pass-confirm" class="form-label-tf">Confirm Password</label>
          <div class="position-relative">
            <input type="password" class="form-control-tf pe-5" id="reg-pass-confirm" placeholder="••••••••" required>
            <button class="btn text-muted-tf position-absolute top-50 end-0 translate-middle-y me-2 p-1 border-0 btn-toggle-password" type="button" data-target-input="reg-pass-confirm" aria-label="Toggle password view">
              <i class="bi bi-eye fs-5"></i>
            </button>
          </div>
        </div>

        <!-- Separate Line 5: Preferred Beauty Profile -->
        <div class="mb-3">
          <label for="reg-profile" class="form-label-tf">Preferred Beauty Profile</label>
          <select class="form-select-tf" id="reg-profile">
            <option value="natural">Natural Luminous (Skin-Mimicking Sheen)</option>
            <option value="matte">Velvet Demi-Matte (Shine-Resistant Focus)</option>
            <option value="radiant">Dewy Radiant (High Hydration Glow)</option>
            <option value="unsure">Not Sure — Need Recommendation</option>
          </select>
        </div>

        <!-- Terms Checkbox -->
        <div class="mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="termsCheck" required>
            <label class="form-check-label small text-muted-tf" for="termsCheck">
              I agree to the <a href="#" class="text-accent text-decoration-none">Terms of Service</a> & <a href="#" class="text-accent text-decoration-none">Privacy Policy</a> (Demo).
            </label>
          </div>
        </div>

        <!-- Primary Action Button -->
        <button type="submit" class="btn-tf-primary w-100 py-3 mb-3">
          Create Account
        </button>

        <div class="text-center small text-muted-tf mb-3">
          Already have an account? <a href="login.html" class="text-accent fw-bold text-decoration-none">Login</a>
        </div>
      </form>

      <!-- Social Logins (Google & Apple) in Bottom -->
      <div class="position-relative text-center my-3">
        <hr class="border-tf">
        <span class="position-absolute top-50 start-50 translate-middle px-3 bg-surface font-tech small text-muted-tf" style="font-size: 0.7rem; letter-spacing: 0.05em;">OR CONTINUE WITH</span>
      </div>

      <div class="auth-social-buttons d-flex gap-3 justify-content-center mb-3">
        <button type="button" class="btn-tf-outline d-flex align-items-center justify-content-center gap-2 flex-grow-1 py-2" onclick="alert('Demo: Google Sign-In Simulated.')">
          <i class="bi bi-google fs-5"></i> <span class="small font-tech">Google</span>
        </button>
        <button type="button" class="btn-tf-outline d-flex align-items-center justify-content-center gap-2 flex-grow-1 py-2" onclick="alert('Demo: Apple Sign-In Simulated.')">
          <i class="bi bi-apple fs-5"></i> <span class="small font-tech">Apple</span>
        </button>
      </div>

    </div>

  </main>

  <!-- Back to Top Button -->
  <button id="btn-back-to-top" class="btn-back-to-top" type="button" aria-label="Back to top" title="Back to top">
    <i class="bi bi-arrow-up"></i>
  </button>

  <script src="assets/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/gsap.min.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
