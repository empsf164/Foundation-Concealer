<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Login — TONE / FORM | Beauty-Tech Portal</title>
  <meta name="description" content="Sign in to your TONE / FORM beauty profile to access your saved complexion matches, custom kits, and order records.">
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="stylesheet" href="assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-surface">

  <!-- Main Centered Layout -->
  <main class="min-vh-100 d-flex flex-column align-items-center justify-content-center p-4 position-relative">
    
    <!-- Top Right Corner Theme Toggle Button Only -->
    <div class="position-absolute top-0 end-0 p-3 p-md-4 z-3">
      <button class="btn-theme-toggle" type="button" aria-label="Toggle theme" title="Toggle light or dark theme">
        <i class="bi bi-moon-stars"></i>
      </button>
    </div>

    <!-- Brand Logo Top Center Above Box -->
    <div class="text-center mb-4">
      <a class="navbar-brand navbar-brand-logo d-inline-flex align-items-center gap-2 text-decoration-none" href="index.html">
        <svg class="brand-logo-icon" width="34" height="34" viewBox="0 0 48 48" fill="none">
          <circle cx="20" cy="24" r="14" stroke="currentColor" stroke-width="2.8" opacity="0.95"/>
          <circle cx="28" cy="24" r="14" stroke="currentColor" stroke-width="2.8" opacity="0.85"/>
          <circle cx="24" cy="24" r="4.5" fill="currentColor"/>
        </svg>
        <span class="fs-4 fw-bold">TONE <span class="divider">/</span> FORM</span>
      </a>
    </div>

    <!-- Centered Login Box -->
    <div class="card p-4 p-md-5 border-tf bg-surface rounded-4 shadow-sm w-100" style="max-width: 440px;">
      
      <div class="text-center mb-4">
        <span class="editorial-tag">Authentication</span>
        <h2 class="display-font mb-1">Welcome Back</h2>
        <p class="text-muted-tf small mb-0">Enter your credentials to access your profile.</p>
      </div>

      <!-- Login Form -->
      <form id="login-form">
        <!-- Separate Line 1: Email Address -->
        <div class="mb-3">
          <label for="login-email" class="form-label-tf">Email Address</label>
          <input type="email" class="form-control-tf" id="login-email" placeholder="name@domain.com" required value="demo.customer@toneform.com">
        </div>

        <!-- Separate Line 2: Password with Eye Icon inside end of field -->
        <div class="mb-3">
          <label for="login-password" class="form-label-tf">Password</label>
          <div class="position-relative">
            <input type="password" class="form-control-tf pe-5" id="login-password" placeholder="••••••••" required value="demoPass123">
            <button class="btn text-muted-tf position-absolute top-50 end-0 translate-middle-y me-2 p-1 border-0 btn-toggle-password" type="button" data-target-input="login-password" aria-label="Toggle password view">
              <i class="bi bi-eye fs-5"></i>
            </button>
          </div>
        </div>

        <!-- Separate Line 3: Remember Me AND Forgot Password on Same Line -->
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check mb-0">
            <input class="form-check-input" type="checkbox" id="rememberMe" checked>
            <label class="form-check-label small text-muted-tf" for="rememberMe">Remember me</label>
          </div>
          <a href="forgot-password.html" class="small text-accent font-tech text-decoration-none">Forgot password?</a>
        </div>

        <!-- Primary Action Button -->
        <button type="submit" class="btn-tf-primary w-100 py-3 mb-3">
          Sign In to Account
        </button>

        <div class="text-center small text-muted-tf mb-3">
          Don't have an account? <a href="signup.html" class="text-accent fw-bold text-decoration-none">Sign Up</a>
        </div>
      </form>

      <!-- Social Logins (Google & Apple) in Bottom -->
      <div class="position-relative text-center my-3">
        <hr class="border-tf">
        <span class="position-absolute top-50 start-50 translate-middle px-3 bg-surface font-tech small text-muted-tf" style="font-size: 0.7rem; letter-spacing: 0.05em;">OR CONTINUE WITH</span>
      </div>

      <div class="d-flex gap-3 justify-content-center mb-3">
        <button type="button" class="btn-tf-outline d-flex align-items-center justify-content-center gap-2 flex-grow-1 py-2" onclick="alert('Demo: Google Sign-In Simulated.')">
          <i class="bi bi-google fs-5"></i> <span class="small font-tech">Google</span>
        </button>
        <button type="button" class="btn-tf-outline d-flex align-items-center justify-content-center gap-2 flex-grow-1 py-2" onclick="alert('Demo: Apple Sign-In Simulated.')">
          <i class="bi bi-apple fs-5"></i> <span class="small font-tech">Apple</span>
        </button>
      </div>

      <!-- Internal Staff Portal Callout -->
      <div class="mt-3 pt-3 border-top border-tf text-center">
        <a href="dashboard.html" class="small font-tech text-secondary-tf text-decoration-none">
          <i class="bi bi-shield-lock me-1 text-accent"></i> Inventory Dashboard Access &rarr;
        </a>
      </div>

    </div>

  </main>

  <!-- Back to Top Button -->
  <button id="btn-back-to-top" class="btn-back-to-top" type="button" aria-label="Back to top" title="Back to top">
    <i class="bi bi-arrow-up"></i>
  </button>

  <script src="assets/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/gsap.min.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
